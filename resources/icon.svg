<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Git graph icon: nodes connected by edges representing a branching tree -->
  <circle cx="12" cy="4" r="2.5" fill="currentColor" opacity="0.9"/>
  <circle cx="6" cy="14" r="2.5" fill="currentColor" opacity="0.7"/>
  <circle cx="18" cy="14" r="2.5" fill="currentColor" opacity="0.7"/>
  <circle cx="12" cy="21" r="2" fill="currentColor" opacity="0.5"/>
  <!-- Edges -->
  <line x1="12" y1="6.5" x2="6" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="12" y1="6.5" x2="18" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="6" y1="16.5" x2="12" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="18" y1="16.5" x2="12" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>

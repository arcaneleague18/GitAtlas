name: Publish Extension

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write # Required for OIDC and Microsoft Entra ID workload identity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview && npm ci
        
      - name: Package extension (Verify build)
        run: npm run package

      # Authenticate via OIDC to Azure/VS Code Marketplace
      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --oidc
